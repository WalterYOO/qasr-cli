[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qasr-cli"
version = "0.3.3"
description = "Script-friendly local ASR runtime and batch/alignment front-end for Qwen3-ASR"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
local = ["qwen-asr==0.0.6", "torch>=2.4"]
hf = ["huggingface_hub>=0.24"]
modelscope = ["modelscope>=1.15"]
vllm = ["qwen-asr[vllm]==0.0.6"]
mic = ["sounddevice>=0.4"]
all = ["qasr-cli[local,mic,hf,modelscope]"]
dev = ["pytest>=8", "ruff", "mypy", "jsonschema"]

[project.scripts]
qasr = "qasr_cli.cli:main"

[tool.setuptools.packages.find]
include = ["qasr_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires RUN_INTEGRATION=1 and local models",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["qasr_cli"]
